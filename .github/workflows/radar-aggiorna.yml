name: radar-aggiorna
# Aggiorna i dati del Radar (ISTAT per le regioni, Eurostat per i Paesi).
# Il job pianificato parte solo dal branch predefinito (main); sul branch radar-dev parte al push.
on:
  schedule:
    - cron: "17 5 * * *"   # ogni giorno, 05:17 UTC (06:17/07:17 in Italia)
  push:
    branches: [radar-dev]
    paths: ["scripts/radar/**", ".github/workflows/radar-aggiorna.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-aggiorna
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests shapely
      - name: Regioni italiane (ISTAT)
        run: python scripts/radar/build.py
        continue-on-error: true
      - name: Paesi europei (Eurostat)
        run: python scripts/radar/build_eu.py
        continue-on-error: true
      - name: Pubblica i dati solo se sono cambiati
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add data/radar
          if git diff --cached --quiet; then echo "Nessuna variazione nei dati"; exit 0; fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/radar/aggiornato.txt
          git add data/radar
          git commit -m "radar: aggiornamento dati [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push

name: radar-probe
on:
  push:
    branches: [radar-dev]
    paths: ["scripts/radar/**", ".github/workflows/radar-probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/radar/${SCRIPT:-decode}.py
      - name: Salva il report sul branch di sviluppo
        if: always()
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add data/radar && (git diff --cached --quiet || git commit -m "radar: report sonda [skip ci]" && git push) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: radar-probe, path: data/radar/ }
